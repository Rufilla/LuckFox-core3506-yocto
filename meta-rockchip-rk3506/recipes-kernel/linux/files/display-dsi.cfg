# Kernel config fragment for the Luckfox 10.1-DSI-TOUCH-A panel
# attached to the foxbridge carrier. Merged in when MACHINE_FEATURES
# contains "screen".

# Rockchip VOP + DW MIPI DSI host. Mirrors arch/arm/configs/rk3506-display.config
# from the rockchip-linux kernel tree.
CONFIG_DRM=y
CONFIG_DRM_KMS_HELPER=y
CONFIG_DRM_GEM_DMA_HELPER=y
CONFIG_DRM_BRIDGE=y
CONFIG_DRM_NOMODESET=y
CONFIG_DRM_IGNORE_IOTCL_PERMIT=y
CONFIG_DRM_MIPI_DSI=y
CONFIG_DRM_DW_MIPI_DSI=y
CONFIG_ROCKCHIP_DW_MIPI_DSI=y
CONFIG_DRM_ROCKCHIP=y
CONFIG_ROCKCHIP_VOP=y
CONFIG_ROCKCHIP_RGB=y
CONFIG_VIDEOMODE_HELPERS=y
CONFIG_FB_CMDLINE=y

# Generic DSI panel driver. The 10.1-DSI-TOUCH-A is an ILI9881C panel
# driven via the simple-panel-dsi binding with a panel-init-sequence
# in DT (matches the Luckfox SDK's "10inch1" config).
CONFIG_DRM_PANEL=y
CONFIG_DRM_PANEL_BRIDGE=y
CONFIG_DRM_PANEL_SIMPLE=y
CONFIG_DRM_PANEL_SIMPLE_OF_ONLY=y
CONFIG_DRM_PANEL_ORIENTATION_QUIRKS=y

# Backlight class. The waveshare-backlight driver registers a
# backlight class device for the I2C-controlled MCU at 0x45.
CONFIG_BACKLIGHT_CLASS_DEVICE=y
CONFIG_BACKLIGHT_WAVESHARE=y

# Goodix GT9271 touch controller for the 10.1-DSI-TOUCH-A panel
# (10-point capacitive at I2C 0x5d).
CONFIG_INPUT_TOUCHSCREEN=y
CONFIG_TOUCHSCREEN_GOODIX=y

# USB HID transport for keyboards/mice on the USB host port. HID core +
# HID_GENERIC + INPUT_EVDEV are already on, but without USB_HID the usbhid
# driver is absent, so a plugged-in USB keyboard/mouse enumerates yet binds
# no driver and never creates /dev/input/event* — needed for Doom keyboard
# input (and any USB input device).
CONFIG_USB_HID=y

# Boot splash / on-screen output. Without these the DRM device has no
# fbdev, so nothing drives the panel until a userspace KMS client sets a
# mode (the panel stays dark through boot). FBDEV emulation creates
# /dev/fb0 over the DRM device; FRAMEBUFFER_CONSOLE puts the kernel console
# on the panel; LOGO draws the boot logo as soon as the panel binds. This
# gives an automatic boot image and also provides the /dev/fb0 that psplash
# (pulled in via packagegroup-luckfox-screen) needs for a graphical splash.
# DEFERRED_TAKEOVER keeps the logo/splash on screen until the first console
# text actually needs to be shown.
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_FB=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE_DEFERRED_TAKEOVER=y
CONFIG_LOGO=y
CONFIG_LOGO_LINUX_CLUT224=y
