# Phase 4: dm-verity verified rootfs + overlayfs writable data (built-in, since
# the root device is set up at boot via dm-mod.create= in the signed bootargs).
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y
# dm-mod.create= cmdline device creation (sets up /dev/dm-0 before rootfs mount).
CONFIG_DM_INIT=y
# sha256 for the verity Merkle tree (also used by FIT; keep explicit).
CONFIG_CRYPTO_SHA256=y
# overlayfs for the writable data partition over the read-only rootfs.
CONFIG_OVERLAY_FS=y
