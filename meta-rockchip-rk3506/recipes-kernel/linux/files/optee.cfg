# OP-TEE client support: bind the kernel TEE subsystem + OP-TEE driver to the
# firmware/optee (linaro,optee-tz) DT node so /dev/tee* and /dev/teepriv* are
# created and tee-supplicant / xtest can reach the secure world. Pulled in
# only for the from-source OP-TEE build (OPTEE_PROVIDER = optee-os-rk3506),
# alongside rk3506b-luckfox-core3506-optee.dtsi.
CONFIG_TEE=y
CONFIG_OPTEE=y
