# RK3506 SoC vendor layer for Yocto.
# Derived from the Rockchip vendor SDK; builds and boots on LuckFox Core3506
# hardware. See BRIEFING.md for the per-component detail.

# Layer configuration for meta-rockchip-rk3506
BBPATH .= ":${LAYERDIR}"

BBFILES += "\
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "rockchip-rk3506"
BBFILE_PATTERN_rockchip-rk3506 = "^${LAYERDIR}/"
BBFILE_PRIORITY_rockchip-rk3506 = "8"

LAYERDEPENDS_rockchip-rk3506 = "core"
LAYERSERIES_COMPAT_rockchip-rk3506 = "scarthgap styhead"

# Vendor-layer integrations that only activate when the named collection is in bblayers.
# Keeps the layer parsable on its own while letting the kernel/u-boot recipes opt into
# third-party features (e.g. meta-rufilla-lucerna scan-artifact packaging) when present.
BBFILES_DYNAMIC += "meta-rufilla-lucerna:${LAYERDIR}/dynamic-layers/meta-rufilla-lucerna/*/*/*.bbappend"

# This layer provides the vendor BSP kernel and bootloader for the RK3506 SoC family.
