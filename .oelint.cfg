{
  "_comment": "Custom rule severities for the meta-rockchip-rk3506 / meta-luckfox-bsp / meta-luckfox-distro layers. Generated from `oelint-adv --print-rulefile` (scarthgap defaults) with explicit 'inactive' overrides applied. Rule keys NOT in this file would otherwise be ignored \u2014 oelint-adv's --rulefile REPLACES the default ruleset rather than merging, so we ship the full rule list. To re-tighten a rule, edit its severity in this file (e.g. 'inactive' \u2192 'warning' / 'error'). Why each suppression exists is documented in the matching `_why_<rule>` key above each `oelint.*` entry.",
  "_why_oelint.vars.noncoreoverride": "All non-core recipes in meta-luckfox-distro are net-new (foxbridge-wifi, foxbridge-status, foxbridge-mcp, picoclaw, packagegroup-luckfox-base, image recipes) and have COMPATIBLE_MACHINE = luckfox-core3506. They are not bbappends to poky-core, so the rule's 'add :luckfox-core3506 suffix to your assignments' guidance does not apply. Defensive-only suppression for any future bbappends.",
  "oelint.vars.noncoreoverride": "inactive",
  "_why_oelint.var.licenseremotefile": "foxbridge-wifi and foxbridge-status use ${COMMON_LICENSE_DIR}/MIT \u2014 that file IS bundled with poky and is locally-stable. False positive on poky-bundled LIC_FILES_CHKSUM patterns.",
  "oelint.var.licenseremotefile": "inactive",
  "_why_oelint.vars.mispell.unknown": "oelint's constants db doesn't know about every poky task name (do_image_wic) or vendor-specific vars like INHIBIT_PACKAGE_STRIP / RKBIN_SOC_VARIANT / RKBIN_DDR / LICENSE_FLAGS. --constantmods would be more surgical, but for now suppress globally.",
  "oelint.vars.mispell.unknown": "inactive",
  "_why_oelint.var.filesoverride": "Several recipes deliberately replace FILES:${PN} with the exact non-standard install path: foxbridge-status installs to /www/pages (lighttpd doc-root), foxbridge-wifi enumerates explicit absolute paths under /etc and /usr/libexec, picoclaw has a custom layout under ${datadir}/picoclaw, rkbin installs to /usr/share/rkbin. Append-only would either over-include or leak files into the wrong package.",
  "oelint.var.filesoverride": "inactive",
  "_why_oelint.vars.homepageping": "Network probe is flaky in CI and adds a network dependency to a pre-commit hook. Validate HOMEPAGE URLs by hand, not in pre-commit.",
  "oelint.vars.homepageping": "inactive",
  "_why_oelint.vars.insaneskip": "INSANE_SKIP is set on rkbin-rk3506 (binary blobs from vendor \u2014 no debug syms by design), u-boot-rockchip-rk3506 (vendor 2017.09 fork predates modern QA: ldflags), and picoclaw (upstream-prebuilt static Go binary: already-stripped, arch, ldflags, textrel). Each carries a justification comment in the recipe.",
  "oelint.vars.insaneskip": "inactive",
  "_why_oelint.var.badimagefeature.debug-tweaks": "luckfox-image-minimal.inc intentionally enables debug-tweaks for bringup convenience (passwordless root over serial, no SSH key requirement). README's Known Limitations and Future sections both flag this for hardening before production.",
  "oelint.var.badimagefeature.debug-tweaks": "inactive",
  "_why_oelint.task.heredocs": "Defensive \u2014 no heredocs in tasks at present, but reserved in case foxbridge-wifi grows a templated wpa_supplicant placeholder generator (the Lyra Ultra repo uses one in a wpa-supplicant.bbappend). Co-locating templating with credential plumbing keeps readability higher than a separate file.",
  "oelint.task.heredocs": "inactive",
