# LuckFox distribution configuration
# Targets the LuckFox family of embedded Linux boards (Pico, Lyra, Core3506).

DISTRO = "luckfox"
DISTRO_NAME = "LuckFox Linux"
DISTRO_VERSION = "0.1"
DISTRO_CODENAME = "experimental"

# Yocto release compatibility
SANITY_TESTED_DISTROS ?= ""

# Init system: systemd for boards with >=256 MB RAM
# Override to sysvinit or busybox-init in local.conf for low-RAM boards (<=128 MB)
INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " systemd"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

# Base distro features
DISTRO_FEATURES = "largefile ipv4 ipv6 usbhost ${DISTRO_FEATURES_DEFAULT}"

# Remove X11/Wayland — these are headless or LVGL-based systems
DISTRO_FEATURES:remove = "x11 wayland opengl vulkan"

# Accept commercial licenses for rkbin proprietary blobs
LICENSE_FLAGS_ACCEPTED:append = " commercial"

# Package management — use IPK for minimal overhead on embedded targets
PACKAGE_CLASSES = "package_ipk"

# Default to ext4 root filesystem
IMAGE_FSTYPES ?= "wic ext4"
