# Distribution policy layer for LuckFox boards.
# Distro config, image recipes, and packagegroups shared across all machines.

BBPATH .= ":${LAYERDIR}"

BBFILES += "\
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "luckfox-distro"
BBFILE_PATTERN_luckfox-distro = "^${LAYERDIR}/"
BBFILE_PRIORITY_luckfox-distro = "10"

LAYERDEPENDS_luckfox-distro = "core luckfox-bsp"
LAYERSERIES_COMPAT_luckfox-distro = "scarthgap styhead"
