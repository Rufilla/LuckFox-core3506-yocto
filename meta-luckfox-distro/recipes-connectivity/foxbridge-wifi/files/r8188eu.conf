# Module options for the staging r8188eu driver (RTL8188EU, TL-WN725N).
#
# The in-tree staging driver enables two power-save features by default that
# are known to cause silent disconnects: after a short idle period the radio
# stops receiving beacons, the association stays "completed" from the host's
# point of view, but no traffic passes. The standard mitigation (documented
# in countless threads and Realtek community drivers) is to disable both at
# module load.
#
#   rtw_power_mgnt=0  — disable 802.11 power-save
#   rtw_ips_mode=0    — disable Inactive Power Save (radio off when idle)
#
# These do not completely eliminate r8188eu flakiness — it is a staging
# driver with known reliability issues — but they remove the largest source
# of "works briefly then dies silently" behaviour.
options r8188eu rtw_power_mgnt=0 rtw_ips_mode=0
