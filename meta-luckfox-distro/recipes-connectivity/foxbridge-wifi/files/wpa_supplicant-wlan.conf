# Foxbridge WiFi configuration
#
# To connect to a WiFi network:
#   1. Edit this file: replace the placeholder SSID and PSK below with your
#      network's values (or pre-compute the PSK with
#      `wpa_passphrase <ssid> <passphrase>` and paste the hashed psk line).
#   2. Restart the service:  systemctl restart foxbridge-wifi
#
# The foxbridge-wifi service refuses to start while the placeholders are
# still present, so a fresh image boots cleanly without spurious failures.
#
# The service auto-detects the first wl* interface, starts wpa_supplicant
# with the WEXT backend (required by the staging r8188eu driver used for
# the TL-WN725N RTL8188EU dongle), and runs udhcpc to obtain a DHCP lease.

ctrl_interface=/var/run/wpa_supplicant
update_config=1

network={
    ssid="CHANGEME_SSID"
    psk="CHANGEME_PSK"
    key_mgmt=WPA-PSK
}
