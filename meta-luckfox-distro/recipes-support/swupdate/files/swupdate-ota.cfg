# SWUpdate Kconfig fragment for the LuckFox A/B OTA (milestone M1).
# Merged onto meta-swupdate's default defconfig (which already enables the raw
# handler, the U-Boot env backend (CONFIG_UBOOT), and the Mongoose web server).
# See OTA_SWUPDATE_PLAN.md.
#
# CONFIG_ARCHIVE: the archive (libtar/libarchive) handler, so a slot's boot
# partition can be updated by extracting a tarball of boot files (zImage, DTB,
# extlinux.conf pinned to that slot's rootfs) into it — cleaner than shipping a
# prebuilt FAT image per slot. rootfs is still written raw.
CONFIG_ARCHIVE=y

# CONFIG_BOOTLOADERHANDLER: registers the "uboot"/"bootenv" install handler
# (handlers/boot_handler.c) that processes the .swu's `bootenv` section. The
# default defconfig has the U-Boot env *backend* (CONFIG_UBOOT) but NOT this
# handler, so swupdate rejects the bootenv section at parse time:
# "bootloader support absent but sw-description has bootloader section!"
# (core/parser.c looks for a handler named uboot or bootenv). Required for the
# A/B BOOT_ORDER / BOOT_x_LEFT flip.
CONFIG_BOOTLOADERHANDLER=y
# Static-link the bootloader backend (no separate runtime .so to package).
CONFIG_BOOTLOADER_STATIC_LINKED=y

# CONFIG_HASH_VERIFY: verify the per-image sha256 in sw-description (build-ota.py
# emits them). swupdate refuses a supplied-but-unverifiable hash ("hash
# verification not enabled but hash supplied"), so this must be on. Uses the
# already-enabled OpenSSL backend (CONFIG_SSL_IMPL_OPENSSL). Integrity only —
# authenticity (signed .swu) is M2.
CONFIG_HASH_VERIFY=y

# M1 ships UNSIGNED .swu (the boot chain isn't signed yet).
# Signature verification stays off until M2. Kept explicit as a guard.
# CONFIG_SIGNED_IMAGES is not set
