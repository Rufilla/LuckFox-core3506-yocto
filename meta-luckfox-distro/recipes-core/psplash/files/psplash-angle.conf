[Service]
# Rotate the boot splash to match the 10.1-DSI-TOUCH-A panel mounted in
# landscape (native portrait 800x1280). psplash writes raw to /dev/fb0 and
# doesn't honour the DRM panel-orientation hint, so rotate it here.
# Flip 270<->90 if the splash comes out upside-down.
ExecStart=
ExecStart=/usr/bin/psplash --angle 270
