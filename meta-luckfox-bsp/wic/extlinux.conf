default luckfox
label luckfox
    kernel /zImage
    fdt /rk3506b-luckfox-core3506.dtb
    # Single-slot (MBR) layout: rootfs is mmcblk0p2 (boot=p1, rootfs=p2).
    # Must be an explicit device / kernel-resolvable token: this kernel does
    # NOT resolve root=LABEL= (fs label), and the board DTB no longer pins a
    # default root=. (Previously root=LABEL=rootfs only "worked" because the
    # DTB forced root=/dev/mmcblk0p2.) See OTA_SWUPDATE_PLAN.md.
    # Console = ttyS0 (plain 8250 on UART0): the from-source OP-TEE (default
    # provider) shares UART0, so the whole chain is UART0/ttyS0 — no ttyFIQ0
    # fiq-debugger, which would contend with OP-TEE for the port.
    append root=/dev/mmcblk0p2 rootfstype=ext4 rootwait earlycon=uart8250,mmio32,0xff0a0000,115200n8 console=ttyS0,115200 panic=10
