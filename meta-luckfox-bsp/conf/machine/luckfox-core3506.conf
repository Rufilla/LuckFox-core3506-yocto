#@TYPE: Machine
#@NAME: LuckFox Core3506
#@SOC: Rockchip RK3506B
#@DESCRIPTION: LuckFox Core3506 SoM (System on Module) with RK3506B SoC,
#              512 MB DDR3L, on carrier board with 8 GB eMMC storage.
#              Validated on Core3506-0808 + foxbridge carrier (2026-04-10).

require conf/machine/include/luckfox-rk3506.inc

# --- SoC sub-variant ---
# Core3506 uses RK3506B (not RK3506G2)
# This selects the correct DDR init blob and MINIALL.ini from rkbin
RKBIN_SOC_VARIANT = "rk3506b"

# --- U-Boot ---
UBOOT_MACHINE = "rk3506_defconfig"
RK3506_UBOOT_CONFIG_FRAGMENT = "rk3506b.config"

# --- Kernel device tree ---
# Custom DTS for Core3506 SoM + carrier board (serial console + eMMC).
# Source: meta-rockchip-rk3506/recipes-kernel/linux/files/rk3506b-luckfox-core3506.dts
#
# Two DTBs are produced — the headless base, and a 7" DSI variant that
# enables the MIPI-DSI panel + FT5x06 touch + PWM backlight. The 'screen'
# MACHINE_FEATURE selects which one is staged into the boot partition; both
# remain compiled by the kernel build.
KERNEL_DEVICETREE = "${@bb.utils.contains('MACHINE_FEATURES', 'screen', \
                       'rk3506b-luckfox-core3506-dsi.dtb', \
                       'rk3506b-luckfox-core3506.dtb', d)}"

# --- Board hardware features ---
# Core3506 is a bare SoM — features depend on carrier board.
# This config assumes a carrier board with eMMC and USB-A host port.
# No on-board WiFi, Bluetooth, or Ethernet on the SoM itself.
#
# Add 'screen' (e.g. via local.conf: MACHINE_FEATURES:append = " screen") to
# build the 7" DSI variant DTB and pull display + touch drivers into the
# kernel. EXPERIMENTAL — see README "Future" section for status.
MACHINE_FEATURES += "emmc"

# --- RAM ---
LUCKFOX_RAM_MB = "512"

# --- Boot media ---
# WKS_FILE is set per-image recipe:
#   luckfox-image-minimal  → eMMC (flash via rkdeveloptool)
#   luckfox-image-sdcard   → SD card (flash via dd/bmaptool)

# --- Hostname ---
hostname:pn-base-files = "foxbridge"

# --- C library ---
# 512 MB RAM is sufficient for glibc (per spec D1)
# Override with TCLIBC = "musl" in local.conf if desired
